name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web-App bauen und testen
        working-directory: web
        run: |
          npm ci
          npm run build
          npm test

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: APK bauen
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk edgefix.apk

      - uses: actions/upload-artifact@v4
        with:
          name: edgefix-apk
          path: edgefix.apk

      # Nur auf main: als Release veröffentlichen. Die neueste Version liegt dann immer unter
      # https://github.com/<owner>/<repo>/releases/latest/download/edgefix.apk
      - name: Release veröffentlichen
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" edgefix.apk \
            --title "EdgeFix $TAG" \
            --notes "Automatischer Build von ${GITHUB_SHA::7}." \
            --latest
